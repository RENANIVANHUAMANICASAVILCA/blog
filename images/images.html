<!DOCTYPE html><html lang="es"><head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Visor de Foto y Fondo Sincronizados</title> <style> :root { --mi-foto: url('https://lh3.googleusercontent.com/pw/AP1GczNni_AiN1vbSwAWHYtAp68DX47ZZ3tD2VjumQu6d5_EDzfa6vsyc3ecoq744NBciDFve1teffqREZjHkhUAu_9-c1Gw4vO5vm3UkXL6NaumlnzyNoML9p9NRZiCByNnyOvBO9YVUuNtpWa7b4o5sw2lSQ=w1333-h1000-s-no-gm'); } * { box-sizing: border-box; margin: 0; padding: 0; } body { background-color: #000; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; } /* Contenedor principal que ocupa toda la pantalla */ .image-viewer { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow: hidden; } /* Fondo borroso automático usando exactamente la misma variable --mi-foto */ .image-viewer::before { content: ""; position: absolute; top: -15%; left: -15%; right: -15%; bottom: -15%; background-image: var(--mi-foto); background-size: cover; background-position: center; filter: blur(35px); opacity: 0.55; z-index: 1; } /* Foto principal centrada (usa la misma variable --mi-foto a través de CSS o atributo src) */ .main-photo { position: relative; z-index: 2; max-width: 88%; max-height: 75vh; object-fit: contain; border-radius: 8px; box-shadow: 0 10px 35px rgba(0,0,0,0.8); opacity: 1; transform: scale(1); transition: transform 0.6s ease, opacity 0.6s ease; cursor: zoom-in; } .main-photo.is-changing { opacity: 0; transform: scale(0.96); } .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); display: none; align-items: center; justify-content: center; z-index: 20; padding: 24px; backdrop-filter: blur(8px); } .modal-overlay.is-open { display: flex; } .modal-content { position: relative; max-width: min(1100px, 95vw); max-height: min(90vh, 95vh); display: flex; flex-direction: column; align-items: center; gap: 12px; animation: modalIn 0.25s ease; } .modal-image { max-width: 100%; max-height: 80vh; object-fit: contain; border-radius: 14px; box-shadow: 0 20px 45px rgba(0,0,0,0.45); } .modal-close { position: absolute; top: -14px; right: -14px; width: 42px; height: 42px; border: 0; border-radius: 50%; background: rgba(255,255,255,0.95); color: #111; font-size: 24px; cursor: pointer; box-shadow: 0 8px 24px rgba(0,0,0,0.25); } .modal-caption { color: white; font-size: 14px; opacity: 0.9; text-align: center; } @keyframes modalIn { from { transform: scale(0.96); opacity: 0; } to { transform: scale(1); opacity: 1; } } /* Datos de la cámara (EXIF) */ .camera-info { position: relative; z-index: 2; text-align: center; color: white; margin-top: 15px; text-shadow: 0 1px 4px rgba(0,0,0,0.9); } .camera-info .brand { font-size: 16px; font-weight: 800; letter-spacing: -0.5px; margin-right: 4px; } .camera-info .model { font-size: 14px; font-weight: 400; opacity: 0.9; } .camera-info .specs { font-size: 11px; color: rgba(255,255,255,0.7); margin-top: 4px; } .carousel-controls { position: relative; z-index: 2; margin-top: 18px; display: flex; flex-direction: column; align-items: center; gap: 10px; } .carousel-buttons { display: flex; gap: 10px; } .carousel-btn { border: 0; background: rgba(255,255,255,0.16); color: white; padding: 8px 14px; border-radius: 999px; cursor: pointer; backdrop-filter: blur(6px); transition: background 0.2s ease; } .carousel-btn:hover { background: rgba(255,255,255,0.28); } .carousel-dots { display: flex; gap: 8px; } .carousel-dots span { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,0.4); display: inline-block; transition: transform 0.2s ease, background-color 0.2s ease; } .carousel-dots span.active { background: white; transform: scale(1.2); } .carousel-counter { font-size: 12px; color: rgba(255,255,255,0.7); letter-spacing: 0.3px; } .top-logo { position: absolute; top: 20px; left: 20px; z-index: 3; display: flex; align-items: center; gap: 10px; text-decoration: none; color: white; padding: 8px 12px; border-radius: 999px; background: rgba(0, 0, 0, 0.25); backdrop-filter: blur(8px); box-shadow: 0 6px 20px rgba(0,0,0,0.25); } .top-logo img { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; } .top-logo span { font-weight: 700; font-size: 14px; letter-spacing: 0.4px; text-transform: uppercase; } </style></head><body> <a href="../index.html" class="top-logo" aria-label="Ir al inicio"> <img src="../images/logo.png" alt="Logo" onerror="this.style.display='none'"> <span>Atrás</span> </a> <div class="image-viewer"> <!-- La etiqueta img también se sincroniza automáticamente con la misma imagen lh3 --> <img src="" class="main-photo" alt="Mi Foto" id="foto-dinamica"> <div class="camera-info"> <div> <span class="brand">Canon</span> <span class="model">Canon EOS </span> </div> <div class="specs">105mm F5.6 1/250s ISO1250</div> </div> <div class="carousel-controls"> <div class="carousel-buttons"> <button class="carousel-btn" id="anterior-btn" type="button">← Anterior</button> <button class="carousel-btn" id="siguiente-btn" type="button">Siguiente →</button> </div> <div class="carousel-dots" id="carousel-dots"></div> <div class="carousel-counter" id="carousel-counter">1/1</div> </div> </div> <div class="modal-overlay" id="image-modal" aria-hidden="true"> <div class="modal-content"> <button class="modal-close" id="modal-close" type="button" aria-label="Cerrar vista ampliada">×</button> <img src="" class="modal-image" id="modal-image" alt="Vista ampliada"> <div class="modal-caption" id="modal-caption"></div> </div> </div> <script> const rootStyles = getComputedStyle(document.documentElement); const urlFotoInicial = rootStyles.getPropertyValue('--mi-foto').trim().slice(4, -1).replace(/['"]/g, ""); const imagenes = [ urlFotoInicial, "https://lh3.googleusercontent.com/pw/AP1GczOKGaOVDOVI3odaS0a9RlXC4Ns9CTIM3Xu4rsiHgTdU15sOUMFDpWCuaT2IRSgwILqs-Gba9iR79YFAuJtcDP0XmMeUYhJSvfJ4Dwi5JsYM8XkwwTrOgIaeZwgiwWknK8ndb_F-gywo7g8qYYylIHl5oA=w1418-h945-s-no-gm", "https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=1200&q=80" ].filter(Boolean); const foto = document.getElementById('foto-dinamica'); const contador = document.getElementById('carousel-counter'); const puntos = document.getElementById('carousel-dots'); const modal = document.getElementById('image-modal'); const modalImage = document.getElementById('modal-image'); const modalCaption = document.getElementById('modal-caption'); const botonCerrarModal = document.getElementById('modal-close'); let indiceActual = 0; let intervaloAutoavance; function mostrarImagen() { if (!imagenes.length) return; foto.classList.add('is-changing'); setTimeout(() => { const url = imagenes[indiceActual]; const urlSegura = url.replace(/['"]/g, ""); document.documentElement.style.setProperty('--mi-foto', `url("${urlSegura}")`); foto.src = urlSegura; foto.alt = `Foto ${indiceActual + 1}`; contador.textContent = `${indiceActual + 1}/${imagenes.length}`; Array.from(puntos.children).forEach((punto, index) => { punto.classList.toggle('active', index === indiceActual); }); foto.classList.remove('is-changing'); }, 180); } function abrirModal() { const urlActual = foto.src; if (!urlActual) return; modalImage.src = urlActual; modalImage.alt = foto.alt; modalCaption.textContent = `${foto.alt} · ${indiceActual + 1}/${imagenes.length}`; modal.classList.add('is-open'); modal.setAttribute('aria-hidden', 'false'); } function cerrarModal() { modal.classList.remove('is-open'); modal.setAttribute('aria-hidden', 'true'); } function siguiente() { if (!imagenes.length) return; indiceActual = (indiceActual + 1) % imagenes.length; mostrarImagen(); } function anterior() { if (!imagenes.length) return; indiceActual = (indiceActual - 1 + imagenes.length) % imagenes.length; mostrarImagen(); } function reiniciarAutoavance() { clearInterval(intervaloAutoavance); intervaloAutoavance = setInterval(siguiente, 5000); } imagenes.forEach((_, index) => { const punto = document.createElement('span'); punto.addEventListener('click', () => { indiceActual = index; mostrarImagen(); reiniciarAutoavance(); }); puntos.appendChild(punto); }); foto.addEventListener('click', abrirModal); botonCerrarModal.addEventListener('click', cerrarModal); modal.addEventListener('click', (event) => { if (event.target === modal) { cerrarModal(); } }); document.addEventListener('keydown', (event) => { if (event.key === 'Escape') { cerrarModal(); } }); document.getElementById('anterior-btn').addEventListener('click', () => { anterior(); reiniciarAutoavance(); }); document.getElementById('siguiente-btn').addEventListener('click', () => { siguiente(); reiniciarAutoavance(); }); mostrarImagen(); reiniciarAutoavance(); </script></body></html>
