<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Imágenes · Ivan's Blog</title>
<style>:root{--mi-foto:none}*{box-sizing:border-box;margin:0;padding:0}body{width:100vw;height:100vh;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.image-viewer{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}.image-viewer:before{content:"";position:absolute;inset:-15%;background:var(--mi-foto) center/cover;filter:blur(35px);opacity:.55}.main-photo{position:relative;z-index:2;max-width:88%;max-height:75vh;object-fit:contain;border-radius:8px;box-shadow:0 10px 35px rgba(0,0,0,.8);transition:.5s;cursor:zoom-in}.main-photo.is-changing{opacity:0;transform:scale(.96)}.camera-info,.carousel-controls{position:relative;z-index:2;text-align:center;color:#fff}.camera-info{margin-top:15px}.brand{font-weight:800}.model{font-size:14px;opacity:.9}.specs,.carousel-counter{font-size:11px;color:rgba(255,255,255,.7);margin-top:4px}.carousel-controls{margin-top:18px;display:flex;flex-direction:column;align-items:center;gap:10px}.carousel-buttons,.carousel-dots{display:flex;gap:10px}.carousel-btn{border:0;background:rgba(255,255,255,.16);color:#fff;padding:8px 14px;border-radius:999px;cursor:pointer}.carousel-dots span{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.4);cursor:pointer}.carousel-dots span.active{background:#fff;transform:scale(1.2)}.top-logo{position:absolute;top:20px;left:20px;z-index:3;color:#fff;text-decoration:none;padding:10px 14px;border-radius:999px;background:rgba(0,0,0,.35);backdrop-filter:blur(8px);font-size:13px;font-weight:700}.modal-overlay{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.88);backdrop-filter:blur(8px)}.modal-overlay.is-open{display:flex}.modal-content{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px}.modal-image{max-width:95vw;max-height:82vh;object-fit:contain}.modal-close{position:absolute;top:-14px;right:-14px;width:42px;height:42px;border:0;border-radius:50%;font-size:24px;cursor:pointer}.modal-caption{color:#fff;font-size:14px}</style></head>
<body><a href="../index.html" class="top-logo">← Atrás</a><div class="image-viewer"><img class="main-photo" id="foto-dinamica" alt="Fotografía"><div class="camera-info"><span class="brand">Canon</span> <span class="model">Canon EOS</span><div class="specs">105mm F5.6 1/250s ISO1250</div></div><div class="carousel-controls"><div class="carousel-buttons"><button class="carousel-btn" id="anterior-btn">← Anterior</button><button class="carousel-btn" id="siguiente-btn">Siguiente →</button></div><div class="carousel-dots" id="carousel-dots"></div><div class="carousel-counter" id="carousel-counter"></div></div></div><div class="modal-overlay" id="image-modal"><div class="modal-content"><button class="modal-close" id="modal-close">×</button><img class="modal-image" id="modal-image" alt="Vista ampliada"><div class="modal-caption" id="modal-caption"></div></div></div>
<script>let imagenes=[],indiceActual=0,intervalo;const foto=document.getElementById('foto-dinamica'),contador=document.getElementById('carousel-counter'),puntos=document.getElementById('carousel-dots'),modal=document.getElementById('image-modal'),modalImage=document.getElementById('modal-image'),modalCaption=document.getElementById('modal-caption');function mostrar(){if(!imagenes.length)return;foto.classList.add('is-changing');setTimeout(()=>{const item=imagenes[indiceActual],url=item.image.replace(/["']/g,'');document.documentElement.style.setProperty('--mi-foto',`url("${url}")`);foto.src=url;foto.alt=item.title||`Foto ${indiceActual+1}`;contador.textContent=`${indiceActual+1}/${imagenes.length}`;[...puntos.children].forEach((p,i)=>p.classList.toggle('active',i===indiceActual));foto.classList.remove('is-changing')},160)}function cargar(items){imagenes=items.filter(item=>item.published!==false&&item.image);puntos.innerHTML='';imagenes.forEach((_,i)=>{const punto=document.createElement('span');punto.onclick=()=>{indiceActual=i;mostrar();auto()};puntos.appendChild(punto)});indiceActual=0;mostrar();auto()}function siguiente(){indiceActual=(indiceActual+1)%imagenes.length;mostrar()}function auto(){clearInterval(intervalo);intervalo=setInterval(siguiente,5000)}document.getElementById('siguiente-btn').onclick=()=>{siguiente();auto()};document.getElementById('anterior-btn').onclick=()=>{indiceActual=(indiceActual-1+imagenes.length)%imagenes.length;mostrar();auto()};foto.onclick=()=>{modalImage.src=foto.src;modalCaption.textContent=foto.alt;modal.classList.add('is-open')};document.getElementById('modal-close').onclick=()=>modal.classList.remove('is-open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('is-open')};fetch('../content/site.json',{cache:'no-store'}).then(r=>r.json()).then(data=>cargar(data.gallery||[])).catch(()=>{});</script></body></html>
